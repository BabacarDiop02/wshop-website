<script>
document.addEventListener('DOMContentLoaded', function () {
  var slug = new URLSearchParams(window.location.search).get('slug');
  var article = (window.WSHOP_BLOG || []).filter(function (a) { return a.slug === slug; })[0];
  var content = document.getElementById('articleContent');
  if (!article) {
    document.getElementById('articleLoadError').classList.remove('hidden');
    return;
  }
  document.title = article.title + ' — Blog Wshop';
  var desc = document.querySelector('[data-page-description]');
  if (desc) desc.setAttribute('content', article.excerpt);
  document.getElementById('breadcrumbCurrent').textContent = article.title;
  var formattedDate = new Date(article.date + 'T00:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  content.innerHTML =
    '<span class="blog-meta">' + article.category + ' · ' + formattedDate + ' · ' + article.readingTime + ' de lecture</span>' +
    '<h1 class="text-3xl md:text-4xl font-bold text-gray-900 mt-3 mb-8">' + article.title + '</h1>' +
    article.html +
    '<div class="mt-12 pt-8 border-t border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-4">' +
      '<p class="text-gray-700">Un projet en tête après cette lecture ?</p>' +
      '<a href="index.html#contact" class="bg-primary text-white px-6 py-3 !rounded-button font-medium whitespace-nowrap">Demander un devis gratuit</a>' +
    '</div>';
});
</script>
